.wrap{max-width:1040px;margin:0 auto;padding:0 20px 48px}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0 6px}
.back{display:inline-block;padding:10px 20px;border-radius:999px;border:2px solid #fff;color:#fff;text-decoration:none;font-weight:800;font-size:.9rem;background:rgba(31,22,51,.55);transition:.2s}
.back:hover{background:linear-gradient(135deg,var(--accent),var(--accent2))}
h1{text-align:center;margin:10px 0 4px;font-size:clamp(1.8rem,5.5vw,2.8rem);letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.sub{text-align:center;margin:0 auto 22px;max-width:520px;color:rgba(255,255,255,.88);text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* chips de plataforma */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.chip{padding:8px 16px;border-radius:999px;border:2px solid #fff;background:rgba(31,22,51,.6);color:#fff;font:800 .85rem inherit;font-family:inherit;cursor:pointer;transition:.2s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-selected="true"]{background:var(--c);border-color:#fff;color:var(--t,#fff);box-shadow:0 6px 18px rgba(0,0,0,.4)}

/* carrusel */
.car{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;gap:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:26px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:2px}
.panel{background:rgba(31,22,51,.82);border:2px solid #fff;border-radius:24px;padding:28px 26px 30px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:54px;height:54px;border-radius:16px;background:var(--c);display:grid;place-items:center;flex:none;color:var(--t,#fff);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.logo svg{width:30px;height:30px;display:block}
.ph h2{margin:0;font-size:clamp(1.25rem,3.4vw,1.8rem);line-height:1.2}
.ph p{margin:2px 0 0;opacity:.8;font-size:.9rem}
.tiers{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.tiers.one{grid-template-columns:minmax(0,520px);justify-content:center}
.tier{background:rgba(255,255,255,.06);border:2px solid #fff;border-radius:18px;padding:18px 18px 20px;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s}
.tier:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.tier .lv{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--c);color:var(--t,#fff);font-weight:800;font-size:.8rem;letter-spacing:.06em;margin-bottom:10px}
.tier h3{margin:0 0 4px;font-size:1.05rem}
.tier .price{margin:0 0 10px;font-size:.92rem;font-weight:800;color:#f9d5ea}
.tier ul{margin:0;padding:0 0 0 18px}
.tier li{margin:4px 0;font-size:.93rem}
.tier .soon{margin:0;opacity:.7;font-style:italic;font-size:.92rem}
.cta{display:inline-block;margin-top:22px;padding:12px 26px;border-radius:999px;background:var(--c);color:var(--t,#fff);border:2px solid #fff;text-decoration:none;font-weight:800;transition:transform .2s}
.cta:hover{transform:translateY(-2px) scale(1.03)}
.ctar{text-align:center}

/* flechas y puntos */
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:rgba(21,15,34,.85);color:#fff;font-size:18px;cursor:pointer;z-index:3;transition:.2s}
.arrow:hover{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.arrow.prev{left:-14px}.arrow.next{right:-14px}
.arrow[disabled]{opacity:.35;cursor:default}
.dots{display:flex;gap:10px;justify-content:center;margin-top:18px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0;cursor:pointer;transition:.2s}
.dot[aria-current="true"]{background:#fff;transform:scale(1.25)}
.arrow:focus-visible,.chip:focus-visible,.dot:focus-visible,.back:focus-visible,.cta:focus-visible{outline:3px solid #fff;outline-offset:3px}

@media (max-width:760px){
  .tiers{grid-template-columns:minmax(0,1fr)}
  .panel{padding:24px 16px 26px}
  .arrow{width:40px;height:40px;top:auto;bottom:-56px;transform:none}
  .arrow.prev{left:calc(50% - 130px)}.arrow.next{right:calc(50% - 130px)}
  .dots{margin-top:16px;min-height:12px}
  .wrap{padding-bottom:90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.track{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" id="backlink" href="index.html">← Volver al inicio</a></div>
  <h1>Beneficios de subs</h1>
  <p class="sub">Elige tu plataforma y mira qué recibes en cada nivel ✨</p>

  <div class="chips" id="chips" role="tablist" aria-label="Plataformas"></div>

  <div class="car">
    <button class="arrow prev" id="prev" aria-label="Anterior">◀</button>
    <div class="track" id="track" tabindex="0" aria-label="Carrusel de beneficios"></div>
    <button class="arrow next" id="next" aria-label="Siguiente">▶</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
/* =====================================================================
   BENEFICIOS — aquí se llenan los datos (no hace falta tocar nada más).
   Cada nivel tiene:  precio: "..."  y  beneficios: ["...", "..."]
   Si "beneficios" está vacío sale "Próximamente".
   ===================================================================== */
var NIVELES = function(){ return [
  {nivel:"Nivel 1", precio:"", beneficios:[]},
  {nivel:"Nivel 2", precio:"", beneficios:[]},
  {nivel:"Nivel 3", precio:"", beneficios:[]}
]};
var PLATAFORMAS = [
  {
    id:"youtube", chip:"YouTube", titulo:"Beneficios de miembros de YouTube",
    desc:"Hazte miembro de mi canal y recibe beneficios por nivel.",
    color:"#ff3d4f", texto:"#fff", enlace:"https://www.youtube.com/@Alexito_FS/join", boton:"Ser miembro en YouTube →",
    icono:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.900.5A3 3 0 0 0 1 7.200C.5 9.100.5 12 .5 12s0 2.900.5 4.800a3 3 0 0 0 2.100 2.100c1.900.5 8.900.5 8.900.5s7 0 8.900-.5a3 3 0 0 0 2.100-2.100c.5-1.900.5-4.800.5-4.800s0-2.900-.5-4.800ZM9.800 15.300V8.700l5.700 3.300-5.700 3.300Z"/></svg>',
    niveles:NIVELES()
  },
  {
    id:"twitch", chip:"Twitch", titulo:"Beneficios de suscripción en Twitch",
    desc:"Suscríbete en mi canal de Twitch y desbloquea beneficios por nivel.",
    color:"#9146ff", texto:"#fff", enlace:"https://www.twitch.tv/alexitofs", boton:"Ir a mi Twitch →",
    icono:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 2 1.500 6v14.500H7V23h3l2.500-2.500h4L22 15V2H3Zm17 11.500-3.500 3.500h-5.500l-3 3v-3H6V4h14v9.500ZM16.500 7.500H15V12h1.500V7.500ZM12 7.500h-1.500V12H12V7.500Z"/></svg>',
    niveles:NIVELES()
  },
  {
    id:"kick", chip:"Kick", titulo:"Beneficios de suscripción en Kick",
    desc:"Suscríbete en mi canal de Kick y desbloquea beneficios por nivel.",
    color:"#53fc18", texto:"#0b0b0b", enlace:"https://kick.com/alexitofs", boton:"Ir a mi Kick →",
    icono:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 2h6v5h2l4-5h6l-6 8 6.500 12h-6.500l-4-8H9v8H3V2Z"/></svg>',
    niveles:NIVELES()
  },
  {
    id:"tiktok", chip:"TikTok", titulo:"Beneficios del Club de fans de TikTok",
    desc:"Únete al Club de fans en TikTok.",
    color:"#25c7d9", texto:"#0b0b0b", enlace:"https://www.tiktok.com/@alexitofs_", boton:"Ir a mi TikTok →",
    icono:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M16.500 2h-3.200v13.200a2.800 2.800 0 1 1-2.800-2.800c.3 0 .6 0 .8.100V9.200a6 6 0 1 0 5.200 5.900V8.600a7.500 7.500 0 0 0 4.300 1.400V6.800A4.300 4.300 0 0 1 16.500 2Z"/></svg>',
    unico:{nivel:"Club de fans", precio:"", beneficios:[]}   /* TikTok no tiene niveles */
  }
];

/* ============================ Código ============================ */
(function(){
  var $=function(i){return document.getElementById(i)};
  function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
  var track=$("track"),chips=$("chips"),dots=$("dots"),prev=$("prev"),next=$("next");
  var N=PLATAFORMAS.length, cur=0;

  function tier(n,unico){
    var t=el("div","tier");
    t.append(el("span","lv",n.nivel));
    if(unico) t.append(el("h3",null,"Beneficios para el club"));
    if(n.precio) t.append(el("p","price",n.precio));
    if(n.beneficios&&n.beneficios.length){
      var u=el("ul");n.beneficios.forEach(function(b){u.append(el("li",null,b))});t.append(u);
    }else t.append(el("p","soon","Próximamente ✨"));
    return t;
  }

  PLATAFORMAS.forEach(function(p,i){
    var s=el("div","slide");s.id="s-"+p.id;s.setAttribute("role","tabpanel");
    s.setAttribute("aria-label",p.titulo);
    var pan=el("div","panel");pan.style.setProperty("--c",p.color);pan.style.setProperty("--t",p.texto);
    var ph=el("div","ph");var lg=el("div","logo");lg.innerHTML=p.icono;
    var tx=el("div");tx.append(el("h2",null,p.titulo),el("p",null,p.desc));ph.append(lg,tx);
    var g=el("div","tiers"+(p.unico?" one":""));
    if(p.unico) g.append(tier(p.unico,true)); else p.niveles.forEach(function(n){g.append(tier(n))});
    var cw=el("div","ctar");var a=el("a","cta",p.boton);a.href=p.enlace;a.target="_blank";a.rel="noopener";cw.append(a);
    pan.append(ph,g,cw);s.append(pan);track.append(s);

    var c=el("button","chip",p.chip);c.type="button";c.setAttribute("role","tab");
    c.style.setProperty("--c",p.color);c.style.setProperty("--t",p.texto);
    c.addEventListener("click",function(){ir(i)});chips.append(c);

    var d=el("button","dot");d.type="button";d.setAttribute("aria-label",p.chip);
    d.addEventListener("click",function(){ir(i)});dots.append(d);
  });

  function ir(i){
    i=Math.max(0,Math.min(N-1,i));
    track.scrollTo({left:i*track.clientWidth,behavior:"smooth"});
    marcar(i);
  }
  function marcar(i){
    cur=i;
    [].forEach.call(chips.children,function(c,k){c.setAttribute("aria-selected",k===i)});
    [].forEach.call(dots.children,function(d,k){if(k===i)d.setAttribute("aria-current","true");else d.removeAttribute("aria-current")});
    prev.disabled=i===0;next.disabled=i===N-1;
  }
  var tm;
  track.addEventListener("scroll",function(){
    clearTimeout(tm);
    tm=setTimeout(function(){marcar(Math.round(track.scrollLeft/track.clientWidth))},60);
  });
  prev.addEventListener("click",function(){ir(cur-1)});
  next.addEventListener("click",function(){ir(cur+1)});
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight")ir(cur+1);
    if(e.key==="ArrowLeft")ir(cur-1);
  });
  window.addEventListener("resize",function(){track.scrollTo({left:cur*track.clientWidth,behavior:"auto"})});

  /* abrir directo una plataforma: beneficios.html#twitch */
  var h=(location.hash||"").slice(1),k=PLATAFORMAS.findIndex(function(p){return p.id===h});
  marcar(0);
  if(k>0)setTimeout(function(){track.scrollTo({left:k*track.clientWidth,behavior:"auto"});marcar(k)},0);

  /* si el archivo se renombró (p. ej. "beneficios (1).html"), el enlace de volver se adapta */
  var m=/\/beneficios([^\/]*)\.html$/i.exec(location.pathname);
  if(m&&m[1])$("backlink").setAttribute("href","index"+m[1]+".html");
})();
</script>
</body>
</html>
