<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<script src="intro.js?v=5"></script>
<script src="transicion.js?v=5"></script>
<title>FurryLand · Minecraft · Alexito FS</title>
<meta name="description" content="FurryLand, el server de Minecraft de AlexitoFS: rangos, items, armas, armaduras y donadores.">
<link rel="stylesheet" href="estilo.css">
<meta name="theme-color" content="#150f22">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="tema.css">
<style>
body:before{content:"";position:fixed;inset:-80px;z-index:-2;background:
  radial-gradient(40% 34% at 12% 14%,#ff5fa8 0%,transparent 70%),
  radial-gradient(44% 38% at 88% 18%,#6b3fd1 0%,transparent 70%),
  radial-gradient(50% 44% at 76% 86%,#2fae8a 0%,transparent 72%),
  radial-gradient(44% 40% at 16% 88%,#8f1d6e 0%,transparent 70%),#2a0f35;filter:blur(40px)}
body:after{background:linear-gradient(rgba(16,9,30,.45),rgba(16,9,30,.7))}
:root{--px:"Press Start 2P",ui-monospace,monospace;--ench:#b98cff;--sel:#3fffd8}
.wrap{max-width:1120px}

/* ---------- logo ---------- */
.mc-hero{text-align:center;padding:clamp(40px,8vw,90px) 0 10px}
.mc-logo{display:inline-block;max-width:min(92vw,640px)}
.mc-logo img{width:100%;height:auto;image-rendering:pixelated;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
.mc-wordmark{font:400 clamp(30px,8.4vw,78px)/1 var(--px);letter-spacing:.02em;margin:0;color:#ffd1e6;
  text-shadow:0 1px 0 #ff9cc8,0 2px 0 #f27cb2,0 3px 0 #e0629d,0 4px 0 #c94c88,0 5px 0 #a83a72,0 6px 0 #852b5b,0 7px 0 #5e1d41,0 8px 0 #3c1229,0 18px 34px rgba(0,0,0,.6);
  animation:mcFlota 4s ease-in-out infinite}
.mc-wordmark span{color:#a5ffd9;text-shadow:0 1px 0 #7ff0c0,0 2px 0 #5ad9a6,0 3px 0 #3fbf8c,0 4px 0 #2ea074,0 5px 0 #23825e,0 6px 0 #196449,0 7px 0 #104634,0 8px 0 #0a2c21,0 18px 34px rgba(0,0,0,.6)}
@keyframes mcFlota{50%{transform:translateY(-6px)}}
.mc-by{margin-top:18px;font:500 12px/1 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.mc-by b{color:var(--accent);font-weight:700}
.mc-ip{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:8px 8px 8px 18px;border:1px solid var(--line);border-radius:999px;background:rgba(18,12,36,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mc-ip code{font:700 14px/1 var(--f-mono);letter-spacing:.06em}
.mc-ip small{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mc-ip button{min-height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font:700 13px/1 var(--f-body);cursor:pointer}

/* ---------- carrusel ---------- */
.mc-car{position:relative;margin-top:clamp(32px,6vw,56px);border:2px solid #fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-card);background:#1a1030}
.mc-car .vp{overflow:hidden}
.mc-car .tr{display:flex;transition:transform .6s cubic-bezier(.2,.75,.2,1)}
.mc-sl{position:relative;flex:0 0 100%;aspect-ratio:16/7;min-height:260px;display:flex;align-items:flex-end;background-size:cover;background-position:center}
.mc-sl:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(10,4,20,.88))}
.mc-sl .pat{position:absolute;inset:0;opacity:.22;background-image:linear-gradient(45deg,rgba(255,255,255,.5) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.5) 75%),linear-gradient(45deg,rgba(255,255,255,.5) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.5) 75%);background-size:48px 48px;background-position:0 0,24px 24px}
.mc-sl .txt{position:relative;padding:clamp(18px,4vw,40px) 72px clamp(40px,5vw,48px);max-width:720px}
@media(max-width:640px){.mc-sl .txt{padding:20px 20px 44px}}
.mc-sl .tag{display:inline-block;padding:6px 10px;border-radius:6px;font:400 10px/1 var(--px);letter-spacing:.04em;color:#1c0a15;background:#fff}
.mc-sl h3{font-size:clamp(30px,5.4vw,60px);margin:14px 0 8px;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.mc-sl p{color:var(--ink-2);max-width:48ch;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.mc-sl .btn{margin-top:14px;min-height:40px}
.mc-car .nav{position:absolute;top:50%;transform:translateY(-50%)}
.mc-car .prev{left:12px}.mc-car .next{right:12px}
.mc-car .dots{position:absolute;right:16px;bottom:16px;display:flex;gap:6px}
.mc-car .dots button{width:28px;height:28px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.mc-car .dots button:before{content:"";width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.4);transition:width .3s}
.mc-car .dots button.on:before{width:22px;background:var(--accent)}
.mc-sl.con-img{background:#20232b}
.mc-sl.con-img .pic{position:absolute;inset:14px 14px 14px 50%;background:var(--img) no-repeat center/contain}
.mc-sl.con-img:before{background:radial-gradient(60% 80% at 75% 50%,color-mix(in srgb,var(--c) 18%,transparent),transparent 70%)}
.mc-sl.con-img .txt{max-width:50%;align-self:center}
.mc-sl.con-img .tag{color:#140a1c}
@media(max-width:640px){.mc-car .nav{display:none}.mc-sl{aspect-ratio:auto;min-height:330px}.mc-car .dots{left:0;right:0;justify-content:center;bottom:6px}
  .mc-sl.con-img{min-height:480px}.mc-sl.con-img .pic{inset:12px 12px auto 12px;height:52%}.mc-sl.con-img .txt{max-width:none;align-self:flex-end}}

/* ---------- categorías ---------- */
.mc-tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);z-index:50;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:clamp(40px,7vw,70px) 0 26px;padding:6px;border:1px solid var(--line);border-radius:16px;background:rgba(18,12,36,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mc-tabs button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 16px;border:0;border-radius:11px;background:transparent;color:var(--mute);font:700 15px/1 var(--f-body);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.mc-tabs button canvas{width:22px;height:22px;image-rendering:pixelated}
.mc-tabs button:hover{color:var(--fg);background:var(--line-soft)}
.mc-tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.mc-panel h2{font-size:clamp(40px,7vw,76px);line-height:.9;margin:6px 0 10px}
.mc-panel .lede{margin-bottom:22px}
.mc-panel .eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* ---------- tarjeta grande (rango / armadura / kit) ---------- */
.mc-big{display:grid;grid-template-columns:minmax(240px,.85fr) minmax(0,1.15fr);gap:0;background:var(--surface);border:2px solid #fff;border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden}
.mc-big+.mc-big{margin-top:22px}
.mc-big.rango{border:3px solid var(--c);box-shadow:var(--shadow-card),0 0 46px -16px var(--c)}
.mc-big.rango .mc-stage{border-right-color:color-mix(in srgb,var(--c) 45%,transparent);border-bottom-color:color-mix(in srgb,var(--c) 45%,transparent)}
.mc-big.rango .btn-primary{background:var(--c);border-color:var(--c);color:#140a1c;box-shadow:0 8px 26px -8px var(--c)}
.mc-big.dest{border-color:var(--c,var(--accent));box-shadow:var(--shadow-card),0 0 0 4px color-mix(in srgb,var(--c,var(--accent)) 30%,transparent)}
.mc-stage{position:relative;min-height:420px;background:radial-gradient(70% 60% at 50% 45%,color-mix(in srgb,var(--c,#ff6fae) 28%,transparent),transparent 72%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.18));border-right:1px solid var(--line)}
.mc-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mc-stage .hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap;pointer-events:none}
.mc-stage .ribbon{position:absolute;top:14px;left:14px;padding:7px 10px;border-radius:6px;background:var(--c,var(--accent));color:#1c0a15;font:400 9.5px/1 var(--px)}
.mc-info{padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:14px;min-width:0}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.mc-top h3{font-size:clamp(34px,4.4vw,52px);color:var(--c,var(--fg))}
.mc-price{font:900 40px/1 var(--f-display);white-space:nowrap}
.mc-price small{font:500 12px/1 var(--f-mono);letter-spacing:.1em;color:var(--mute);margin-left:4px}
.mc-free{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid #7cf0b8;color:#7cf0b8;font:700 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.mc-info>p{color:var(--ink-2)}
.mc-info h4{font:500 11.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:4px 0 -2px}
.mc-perks{display:flex;flex-wrap:wrap;gap:6px}
.mc-perks li{padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;background:rgba(255,255,255,.04)}
.mc-info h4 .tip{color:var(--mute);letter-spacing:.04em;text-transform:none;font-family:var(--f-body);font-size:12px}
.mc-pieces{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.mc-pieces li{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);cursor:pointer;transition:border-color .2s,background .2s,transform .2s,filter .25s,opacity .25s;outline:none;-webkit-tap-highlight-color:transparent}
.mc-pieces li:hover,.mc-pieces li:focus-visible,.mc-pieces li.on{border-color:var(--sel);background:rgba(63,255,216,.12);transform:translateY(-1px);box-shadow:0 0 0 1px var(--sel),0 0 22px -6px var(--sel)}
.mc-pieces .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;background:rgba(0,0,0,.25)}
.mc-pieces .ic img{width:28px;height:28px;image-rendering:pixelated}
.mc-pieces .ic i{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.mc-pieces .nm{display:flex;flex-direction:column;min-width:0;flex:1}
.mc-pieces .nm b{font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.mc-pieces .nm em{font:500 10px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-style:normal}
.mc-pieces .cnt{font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;color:var(--mute);white-space:nowrap}
.mc-pieces .cnt.si{color:#d9c2ff}
.mc-ench{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.mc-ench span{padding:3px 8px;border-radius:6px;font:500 12px/1.4 var(--f-body);color:#e4d3ff;background:rgba(150,90,255,.2);border:1px solid rgba(185,140,255,.35)}
.mc-ench .none{color:var(--mute);background:none;border-color:var(--line-soft)}
.mc-ench.grande{gap:6px}
.mc-ench.grande span{font-size:14.5px;padding:6px 11px;border-radius:8px;box-shadow:0 0 18px -6px rgba(170,110,255,.7)}
.mc-perks.bonus li{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.mc-perks.soft li{font-size:13px;color:var(--ink-2)}

/* ---------- enfoque: fondo difuminado + encantamientos de la pieza ---------- */
.mc-veil{position:fixed;inset:0;z-index:880;background:rgba(12,6,24,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s ease,visibility .28s}
.mc-veil.on{opacity:1;visibility:visible}
.mc-veil.fijo{pointer-events:auto}
.mc-big.foco{position:relative;z-index:890;box-shadow:var(--shadow-card),0 0 0 4px rgba(63,255,216,.3),0 0 80px -10px rgba(63,255,216,.45)}
.mc-big .mc-info>*{transition:filter .28s ease,opacity .28s ease}
.mc-big.foco .mc-info>*:not(.mc-pieces):not(h4:has(+.mc-pieces)){filter:blur(3px);opacity:.3}
.mc-big.foco .mc-pieces li:not(.on){filter:blur(1.5px);opacity:.4}
.mc-big.foco .mc-stage .hint,.mc-big.foco .mc-stage .ribbon{opacity:0}
.mc-pop{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;padding:14px 16px 16px;border-radius:16px;border:2px solid var(--sel);background:rgba(22,12,40,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 20px 40px -12px rgba(0,0,0,.7)}
.mc-pop.arriba{top:12px;bottom:auto}
.mc-pop.in{animation:popIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
.mc-pop .hd{display:flex;align-items:center;gap:12px}
.mc-pop .hd img{width:40px;height:40px;image-rendering:pixelated;flex:none}
.mc-pop .hd i{width:22px;height:22px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.mc-pop .hd div{flex:1;min-width:0;display:flex;flex-direction:column}
.mc-pop .hd small{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sel)}
.mc-pop .hd b{font:800 22px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.mc-pop .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);font-size:20px;line-height:1;cursor:pointer;flex:none}
.mc-pop h5{margin:12px 0 0;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mc-pop .ex{margin-top:10px;font-size:13px;color:var(--ink-2)}
@media(hover:hover) and (pointer:fine){.mc-pop .x{display:none}}

/* ---------- rareza, estadísticas, sprites ---------- */
:root{--rz-raro:#5fe08a;--rz-epico:#d78bff;--rz-legendario:#ffc94d}
.mc-rz{display:inline-block;padding:5px 9px;border-radius:6px;font:400 8.5px/1 var(--px);letter-spacing:.02em;color:#140a1c}
.mc-rz.raro{background:var(--rz-raro)}.mc-rz.epico{background:var(--rz-epico)}.mc-rz.legendario{background:var(--rz-legendario)}
.mc-stats{display:flex;gap:8px;flex-wrap:wrap}
.mc-stats span{padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line-soft);font-size:13px;color:var(--mute)}
.mc-stats b{color:var(--fg);font-family:var(--f-mono)}
.mc-card .spr{width:66%;aspect-ratio:1;background-repeat:no-repeat;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));animation:mcFlota 3.4s ease-in-out infinite}
.mc-card .ico.foto img{width:70%;border-radius:12px}
.mc-tabs button img{width:22px;height:22px;image-rendering:pixelated}
.mc-ver{margin-top:10px;font:500 11px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
/* ---------- items: de paga / gratis ---------- */
.mc-saltos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 28px}
.mc-saltos a{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:16px;text-decoration:none;border:2px solid;transition:transform .2s}
.mc-saltos a:hover{transform:translateY(-2px)}
.mc-saltos b{font:900 26px/1 var(--f-display);text-transform:uppercase}
.mc-saltos small{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mc-saltos .pago{border-color:#ffd34d;background:linear-gradient(135deg,rgba(255,211,77,.18),rgba(255,111,174,.08))}
.mc-saltos .pago b{color:#ffe27a}
.mc-saltos .gratis{border-color:#7cf0b8;background:linear-gradient(135deg,rgba(124,240,184,.16),rgba(95,184,255,.06))}
.mc-saltos .gratis b{color:#a5ffd9}
.mc-sec{padding:clamp(16px,3vw,26px);border-radius:var(--r-lg);border:2px solid;margin-bottom:30px;scroll-margin-top:150px}
.mc-sec.pago{border-color:rgba(255,211,77,.65);background:linear-gradient(180deg,rgba(255,211,77,.09),rgba(18,12,36,.35) 260px)}
.mc-sec.gratis{border-color:rgba(124,240,184,.55);background:linear-gradient(180deg,rgba(124,240,184,.08),rgba(18,12,36,.35) 260px)}
.mc-sec-hd{margin-bottom:20px}
.mc-sec-hd h3{font-size:clamp(34px,5vw,54px);margin:10px 0 6px}
.mc-sec.pago .mc-sec-hd h3{color:#ffe27a}.mc-sec.gratis .mc-sec-hd h3{color:#a5ffd9}
.mc-sec-hd p{color:var(--ink-2);max-width:60ch}
@media(max-width:520px){.mc-saltos{grid-template-columns:1fr}}

/* ---------- ventana de compra ---------- */
html.mc-sin-scroll{overflow:hidden}
.mc-modal{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;background:rgba(10,4,20,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fadeIn .2s ease}
.mc-modal[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}}
.mc-modal .box{position:relative;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:clamp(20px,4vw,30px);border-radius:22px;border:2px solid #fff;background:var(--surface-solid,#1a1030);box-shadow:0 40px 80px -20px rgba(0,0,0,.8);animation:popIn .26s cubic-bezier(.2,.8,.2,1)}
.mc-modal .x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.mc-modal h3{font-size:clamp(30px,6vw,44px);margin:8px 44px 6px 0}
.mcm-precio{font:900 34px/1 var(--f-display)}
.mcm-precio small{font:500 12px/1 var(--f-mono);letter-spacing:.1em;color:var(--mute);margin-left:4px}
.mcm-nick{display:flex;flex-direction:column;gap:6px;margin:18px 0 6px}
.mcm-nick span{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.mcm-nick input{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);font:600 16px/1 var(--f-body)}
.mcm-nick input:focus{outline:2px solid var(--accent);outline-offset:1px}
.mcm-nick small{color:var(--mute);font-size:12.5px}
.mcm-pasos{counter-reset:p;display:grid;gap:12px;margin-top:16px}
.mcm-pasos>li{counter-increment:p;position:relative;display:flex;flex-direction:column;gap:10px;padding:14px 14px 14px 58px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.mcm-pasos>li:before{content:counter(p);position:absolute;left:14px;top:14px;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:400 12px/1 var(--px)}
.mcm-pasos b{font-size:16px}
.mcm-pasos p{color:var(--ink-2);font-size:14px;margin-top:3px}
.mcm-pasos p b{font-size:inherit;color:var(--fg)}
.mcm-pasos .btn{align-self:flex-start;min-height:42px}
.mcm-pasos .btn.off{opacity:.45;pointer-events:none}
.mcm-pasos pre{margin:10px 0 0;padding:12px;border-radius:10px;background:rgba(0,0,0,.35);border:1px dashed var(--line);font:500 12.5px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word;color:#e9e2ff;user-select:all}
.mcm-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mcm-nota{margin-top:14px;font-size:12.5px;color:var(--mute)}
.mc-box .vacio{color:var(--ink-2);text-align:center;padding:18px 0}
.mc-box .vacio b{color:#ffe27a}
.mc-obt{font-size:14px;color:var(--ink-2);padding:10px 12px;border-left:3px solid #7cf0b8;background:rgba(124,240,184,.07);border-radius:0 10px 10px 0}
.mc-obt b{color:#7cf0b8}
.mc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
@media(max-width:820px){.mc-big{grid-template-columns:1fr}.mc-stage{min-height:360px;border-right:0;border-bottom:1px solid var(--line)}}

/* ---------- tarjetas chicas (armas / items) ---------- */
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.mc-card{display:flex;flex-direction:column;background:var(--surface);border:2px solid #fff;border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){.mc-card:hover{transform:translateY(-4px)}}
.mc-card .mc-stage{min-height:0;aspect-ratio:1/0.82;border-right:0;border-bottom:1px solid var(--line)}
.mc-card .ico{display:grid;place-items:center}
.mc-card .ico canvas,.mc-card .ico img{position:static;width:46%;height:auto;aspect-ratio:1;image-rendering:pixelated;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));animation:mcFlota 3.4s ease-in-out infinite}
.mc-card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.mc-card h3{font-size:26px}
.mc-card .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mc-card .mc-price{font-size:28px}
.mc-card p{color:var(--ink-2);font-size:14.5px}
.mc-card .mc-actions .btn{min-height:40px;flex:1}
.mc-filter{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 20px}
.mc-filter button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(18,12,36,.62);color:var(--fg);font:600 14px/1 var(--f-body);cursor:pointer}
.mc-filter button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mc-badge{display:inline-block;padding:5px 9px;border-radius:6px;font:400 8.5px/1 var(--px);letter-spacing:.02em}
.mc-badge.pago{background:#ffd34d;color:#2a1a00}.mc-badge.gratis{background:#7cf0b8;color:#06281a}

/* ---------- donadores ---------- */
.mc-don{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-bottom:22px}
@media(max-width:820px){.mc-don{grid-template-columns:1fr}}
.mc-box{background:var(--surface);border:2px solid #fff;border-radius:var(--r-lg);padding:clamp(18px,3vw,28px);box-shadow:var(--shadow-card)}
.mc-meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:clamp(18px,3vw,26px);border-radius:var(--r-lg);border:2px solid #f4cf38;background:linear-gradient(135deg,rgba(244,207,56,.22),rgba(255,111,174,.14)),var(--surface);margin-bottom:18px;box-shadow:var(--shadow-card)}
.mc-meta .big{font:900 clamp(56px,9vw,92px)/.85 var(--f-display);color:#ffe27a;text-shadow:0 6px 30px rgba(244,207,56,.4)}
.mc-meta .big small{font-size:.35em;color:var(--fg);margin-left:6px}
.mc-meta p{flex:1;min-width:220px;color:var(--ink-2)}
.mc-meta p b{color:var(--fg)}
.mc-list li{position:relative;padding-left:22px;margin:9px 0}
.mc-list li:before{content:"";position:absolute;left:2px;top:.5em;width:9px;height:9px;background:#f4cf38;border-radius:2px;transform:rotate(45deg)}
.mc-steps{counter-reset:p}
.mc-steps li{counter-increment:p;position:relative;padding:4px 0 14px 50px;min-height:44px}
.mc-steps li:before{content:counter(p);position:absolute;left:0;top:0;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:400 12px/1 var(--px)}
.mc-steps li:not(:last-child):after{content:"";position:absolute;left:16px;top:38px;bottom:2px;width:2px;background:var(--line)}
.mc-box h3{font-size:30px;margin-bottom:12px}
.mc-rank{display:grid;gap:8px}
.mc-rank li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.mc-rank .pos{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font:400 11px/1 var(--px);background:rgba(255,255,255,.1)}
.mc-rank li:nth-child(1) .pos{background:#f4cf38;color:#2a1a00}.mc-rank li:nth-child(2) .pos{background:#d4d4d8;color:#222}.mc-rank li:nth-child(3) .pos{background:#c98a4b;color:#2a1300}
.mc-rank b{flex:1;overflow-wrap:anywhere}
.mc-rank span{font:700 14px/1 var(--f-mono);color:#ffe27a}
.mc-sin3d{display:grid;place-items:center;text-align:center;padding:20px;color:var(--mute);font-size:14px}
footer{text-align:center;padding:4rem 0 2.5rem}
